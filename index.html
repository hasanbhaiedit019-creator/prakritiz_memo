<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prakritiz - Memo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--green:#2E9E3F;--green-dark:#14451d;--orange:#F47C20;--ink:#1b1b1b;--line:#2b2b2b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',Arial,sans-serif;background:#e9ecea;color:var(--ink);padding:24px 12px;font-size:13px}

  /* ---------- Edit panel (print e dekha jabe na) ---------- */
  .panel{max-width:210mm;margin:0 auto 18px;background:#fff;border-top:5px solid var(--orange);border-radius:8px;padding:18px 20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .panel h2{font-size:16px;color:var(--green-dark);margin-bottom:12px}
  .panel h3{font-size:13px;color:var(--green);margin:14px 0 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  label{display:block;font-size:11.5px;font-weight:500;color:#555;margin-bottom:3px}
  input[type=text],input[type=number]{width:100%;padding:8px 10px;border:1.5px solid #cfd8d1;border-radius:6px;font:400 13px 'Poppins',sans-serif}
  input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(46,158,63,.15)}
  .item-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:end}
  .btn{border:0;border-radius:6px;padding:9px 16px;font:600 13px 'Poppins',sans-serif;cursor:pointer;color:#fff}
  .btn:focus-visible{outline:3px solid var(--green);outline-offset:2px}
  .btn.orange{background:var(--orange)} .btn.green{background:var(--green)} .btn.del{background:#c0392b;padding:9px 12px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

  /* ---------- Memo ---------- */
  .page{width:210mm;max-width:100%;min-height:297mm;margin:0 auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 4px 24px rgba(0,0,0,.12)}
  header{background:var(--green-dark);border-bottom:6px solid var(--orange);padding:26px 36px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-family:'Playfair Display',serif;color:#fff;font-size:38px;font-weight:700}
  .logo-box{background:#fff;border-radius:8px;padding:4px 10px;display:flex;align-items:center;height:64px}
  .logo-box img{height:56px;width:auto;display:block}
  .logo-fallback{font:700 20px 'Poppins',sans-serif;color:var(--orange)}
  main{padding:28px 36px;flex:1;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1.5px solid var(--line)}
  .bill h3{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--green)}
  .bill p{line-height:1.6}
  .meta{min-width:200px}
  .meta div{display:flex;justify-content:space-between;gap:20px;margin-bottom:4px}
  .meta b{font-weight:600}
  .table-wrap{overflow-x:auto;margin-top:20px}
  table{width:100%;border-collapse:collapse;border:1.5px solid var(--line);min-width:520px}
  th,td{padding:10px 12px;text-align:center}
  th{border-bottom:1.5px solid var(--line);font-weight:600;background:#f4faf5;color:var(--green-dark)}
  th+th,td+td{border-left:1.5px solid var(--line)}
  td.name,th.name{text-align:left}
  tbody td{height:40px}
  tbody tr.filler td{height:34px}
  .totals-row{display:flex;justify-content:flex-end;margin-top:-1.5px}
  .totals{width:260px;border:1.5px solid var(--line)}
  .totals div{display:flex;justify-content:space-between;padding:8px 14px}
  .totals .due{border-top:1.5px solid var(--line);background:var(--orange);color:#fff;font-weight:600;font-size:15px}
  .lower{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:24px}
  .lower h4{font-size:14px;font-weight:600;color:var(--green);margin-bottom:6px}
  .lower p{line-height:1.7}
  .sign{align-self:flex-end;text-align:center;min-width:180px}
  .sign span{display:block;border-top:1.5px solid var(--line);padding-top:6px}
  footer{background:var(--green-dark);border-top:6px solid var(--orange);color:#fff;padding:16px 36px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px}

  @page{size:A4 portrait;margin:0}
  @media print{
    html,body{margin:0;padding:0;background:#fff;width:210mm}
    .panel{display:none}
    .page{width:210mm;max-width:none;height:296mm;min-height:0;margin:0;box-shadow:none;break-inside:avoid}
    tbody td{height:36px}
    tbody tr.filler td{height:32px}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  @media (max-width:560px){
    header h1{font-size:28px}
    main,header,footer{padding-left:18px;padding-right:18px}
    .item-row{grid-template-columns:1fr 1fr}
    .item-row .iname{grid-column:1/-1}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<!-- ================= EDIT PANEL: ekhane type korlei memo te change hobe ================= -->
<section class="panel">
  <h2>Memo edit korun</h2>

  <h3>Amader tothyo</h3>
  <div class="grid">
    <div><label for="shopPhone">Amader phone number</label><input type="text" id="shopPhone" placeholder="01XXXXXXXXX"></div>
    <div><label for="shopWebsite">Page / Website link</label><input type="text" id="shopWebsite"></div>
    <div><label for="shopAddress">Dokaner thikana</label><input type="text" id="shopAddress"></div>
    <div><label for="payment">Payment info (bKash/Nagad)</label><input type="text" id="payment"></div>
  </div>

  <h3>Customer tothyo</h3>
  <div class="grid">
    <div><label for="customerName">Customer er nam</label><input type="text" id="customerName"></div>
    <div><label for="customerAddress">Customer er thikana</label><input type="text" id="customerAddress"></div>
    <div><label for="customerPhone">Customer er phone</label><input type="text" id="customerPhone"></div>
    <div><label for="memoNo">Memo no</label><input type="text" id="memoNo"></div>
    <div><label for="date">Date</label><input type="text" id="date"></div>
    <div><label for="delivery">Delivery charge</label><input type="number" id="delivery" min="0"></div>
  </div>

  <h3>Product list</h3>
  <div id="itemEditor"></div>
  <button class="btn green" type="button" id="addItem">+ Product add korun</button>

  <h3>Terms &amp; Condition</h3>
  <input type="text" id="terms">

  <div class="actions">
    <button class="btn orange" type="button" id="dlPdf">PDF Download (A4)</button>
    <button class="btn green" type="button" onclick="window.print()">Print</button>
    <button class="btn del" type="button" id="resetAll">Notun memo (sob muche felun)</button>
  </div>
</section>

<!-- ================= MEMO ================= -->
<div class="page">
  <header>
    <h1>Memo</h1>
    <div class="logo-box">
      <!-- Logo: GitHub repo te "image" folder e logo.png nam e upload korun -->
      <img src="image/logo.png" alt="Prakritiz" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-fallback',textContent:'PRAKRITIZ'}))">
    </div>
  </header>
  <main>
    <div class="top">
      <div class="bill">
        <h3>Bill to</h3>
        <p id="o-customerName"></p><p id="o-customerAddress"></p><p id="o-customerPhone"></p>
      </div>
      <div class="meta">
        <div><span>Memo No</span><b id="o-memoNo"></b></div>
        <div><span>Date</span><b id="o-date"></b></div>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th style="width:56px">No.</th><th class="name">Product Name</th><th style="width:110px">Price</th><th style="width:80px">Qty.</th><th style="width:120px">Total</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="totals-row">
      <div class="totals">
        <div><span>Subtotal</span><span id="t-sub"></span></div>
        <div><span>Delivery</span><span id="t-del"></span></div>
        <div class="due"><span>Amount Due</span><span id="t-due"></span></div>
      </div>
    </div>
    <div class="lower">
      <div>
        <h4>Payment Info</h4><p id="o-payment"></p>
        <h4 style="margin-top:14px">Terms &amp; Condition</h4><p id="o-terms" style="max-width:340px"></p>
      </div>
      <div class="sign"><span>Authorised Sign</span></div>
    </div>
  </main>
  <footer>
    <span id="o-shopPhone"></span><span id="o-shopWebsite"></span><span id="o-shopAddress"></span>
  </footer>
</div>

<script>
/* ===== DEFAULT TOTHYO (prothom bar page khulle eigulo dekhabe) =====
   Amader number ekhane bosale shob somoy default hishebe thakbe,
   othoba page er "Amader phone number" box e type korleo hobe (browser e save thake). */
const DEFAULTS = {
  shopPhone: "01XXXXXXXXX",
  shopWebsite: "facebook.com/prakritiz",
  shopAddress: "Khulna, Bangladesh",
  payment: "bKash / Nagad: 01XXXXXXXXX (Personal)",
  customerName: "", customerAddress: "", customerPhone: "",
  memoNo: "001", date: new Date().toLocaleDateString('en-GB'),
  delivery: 60,
  terms: "Product delivery howar por 3 diner moddhe jogajog korun.",
  items: [{ name: "", price: 0, qty: 1 }]
};
const CUR = "৳";
const KEY = "prakritiz_memo_v1";

const $ = id => document.getElementById(id);
const textFields = ["shopPhone","shopWebsite","shopAddress","payment","customerName","customerAddress","customerPhone","memoNo","date","terms"];
const money = n => CUR + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

let data;
try { data = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ data = null; }
data = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), data || {});

function save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} }

function render(){
  textFields.forEach(f => $('o-'+f).textContent = data[f]);
  let sub = 0;
  const tb = $('rows'); tb.innerHTML = '';
  data.items.forEach((it,i) => {
    const total = (+it.price||0) * (+it.qty||0); sub += total;
    const tr = document.createElement('tr');
    [String(i+1).padStart(2,'0'), it.name, money(it.price), it.qty, money(total)].forEach((v,c) => {
      const td = document.createElement('td'); td.textContent = v; if(c===1) td.className='name'; tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  for(let i=data.items.length;i<8;i++){
    const tr=document.createElement('tr'); tr.className='filler'; tr.innerHTML='<td></td><td></td><td></td><td></td><td></td>'; tb.appendChild(tr);
  }
  $('t-sub').textContent = money(sub);
  $('t-del').textContent = money(data.delivery);
  $('t-due').textContent = money(sub + (+data.delivery||0));
  save();
}

function buildEditor(){
  const box = $('itemEditor'); box.innerHTML = '';
  data.items.forEach((it,i) => {
    const row = document.createElement('div'); row.className = 'item-row';
    row.innerHTML = `
      <div class="iname"><label>Product er nam</label><input type="text" value=""></div>
      <div><label>Price</label><input type="number" min="0" value=""></div>
      <div><label>Quantity</label><input type="number" min="0" value=""></div>
      <button class="btn del" type="button" aria-label="Product muche felun">✕</button>`;
    const [n,p,q] = row.querySelectorAll('input');
    n.value = it.name; p.value = it.price; q.value = it.qty;
    n.oninput = () => { data.items[i].name = n.value; render(); };
    p.oninput = () => { data.items[i].price = +p.value; render(); };
    q.oninput = () => { data.items[i].qty = +q.value; render(); };
    row.querySelector('button').onclick = () => { data.items.splice(i,1); if(!data.items.length) data.items.push({name:"",price:0,qty:1}); buildEditor(); render(); };
    box.appendChild(row);
  });
}

textFields.forEach(f => { $(f).value = data[f]; $(f).oninput = e => { data[f] = e.target.value; render(); }; });
$('delivery').value = data.delivery;
$('delivery').oninput = e => { data.delivery = +e.target.value; render(); };
$('addItem').onclick = () => { data.items.push({name:"",price:0,qty:1}); buildEditor(); render(); };
$('resetAll').onclick = () => {
  if(!confirm("Customer, product ar memo no muche notun memo shuru korben? (Amader number thakbe)")) return;
  const keep = {shopPhone:data.shopPhone, shopWebsite:data.shopWebsite, shopAddress:data.shopAddress, payment:data.payment, terms:data.terms, delivery:data.delivery};
  data = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), keep);
  textFields.forEach(f => $(f).value = data[f]);
  buildEditor(); render();
};

buildEditor(); render();

/* ===== PDF Download: browser er header/footer (time, title, url) chhara A4 PDF ===== */
$('dlPdf').onclick = async () => {
  const btn = $('dlPdf'), page = document.querySelector('.page');
  btn.disabled = true; btn.textContent = 'PDF hocche...';
  const oldH = page.style.height, oldW = page.style.width, oldMin = page.style.minHeight;
  page.style.width = '210mm'; page.style.height = '296mm'; page.style.minHeight = '0';
  try {
    const name = 'Prakritiz-Memo-' + (data.memoNo || 'new') + '.pdf';
    await html2pdf().set({
      margin: 0,
      filename: name,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, scrollY: 0, windowWidth: 794 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(page).save();
  } catch (e) {
    alert('PDF banano jai ni. "Print" button use korun.');
  }
  page.style.height = oldH; page.style.width = oldW; page.style.minHeight = oldMin;
  btn.disabled = false; btn.textContent = 'PDF Download (A4)';
};
</script>
</body>
</html>
